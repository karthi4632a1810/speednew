# Netlify Configuration for Single Page Application (SPA)

[build]
  command = "npm run build"
  publish = "dist"

# SPA routing redirect rule
# Ensures all route requests (e.g. /about, /about-doctor, /profile) route to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
